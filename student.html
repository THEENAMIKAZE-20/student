<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body{
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
    }
    button{
        padding: 10px 20px;
    }
</style>
<body>
    <div class="stud">
        <h1>Student Details</h1>
        <input type="text" id="id"    placeholder="Enter the Student-id">
        <br> <br>
        <input type="text" id="name"  placeholder="Enter the student-name">
        <br> <br>
        <input type="text"  id="course"  placeholder="Enter the student-course">
          <br> <br>
  <button onclick="addStudent()">Add Student</button>
    </div>
    <br><br>
<center>
    
     <table class="border border-3 border-primary">
        <thead>
            <tr>
                <th class="border border-3 border-primary">Student ID</th>
                <th class="border border-3 border-primary">Name</th>
                <th class="border border-3 border-primary">Course</th>
                <th class="border border-3 border-primary">Actions</th>
            </tr>
        </thead>
        <tbody  id="result">

        </tbody>
</table>
</center>
</body>
<script>
    function addStudent(){
     let   id=document.getElementById("id").value
       let name=document.getElementById("name").value
        let   course=document.getElementById("course").value

        let student={
            id:id,
            name:name,
            course:course
        }
        students=JSON.parse(localStorage.getItem("students"))||[]
        students.push(student)

        localStorage.setItem("students",JSON.stringify(students))
        displayStudent()
    }


    function displayStudent(){
        students=JSON.parse(localStorage.getItem("students"))||[]
        result=document.getElementById("result")
        result.innerHTML=""
        for(let student of students){
            let tr=document.createElement("tr")
            tr.innerHTML=`<td>${student.id}</td>
<td>${student.name}</td>
<td>${student.course}</td>
<td> <button onclick="deleteTask(this)">Delete</button>
<button onclick="editTask(this)">Edit</button> </td>`
  result.appendChild(tr)
        }
      
    }




    function editTask(button){
        students=JSON.parse(localStorage.getItem("students"))||[]
        let tr=button.parentElement.parentElement
        let id=tr.querySelectorAll("td")[0]
         let name=tr.querySelectorAll("td")[1]
          let course=tr.querySelectorAll("td")[2]


         let oldId=id.textContent
         let oldName=name.textContent
        let  oldCourse=course.textContent

      let    newId=prompt("Edit id",oldId)
      let    newName=prompt("Edit name",oldName)
        let  newCourse=prompt("Edit course",oldCourse)

          id.textContent=  newId
name.textContent= newName
course.textContent= newCourse


    for(let student of students) {

        if(student.id == oldId &&
           student.name == oldName &&
           student.course == oldCourse) {

            student.id = newId;
            student.name = newName;
            student.course = newCourse;
        }
    }
localStorage.setItem("students", JSON.stringify(students));
    }



    function deleteTask(button){
       let tr=button.parentElement.parentElement
    let   oldId=tr.querySelectorAll("td")[0].textContent
      let  students=JSON.parse(localStorage.getItem("students"))||[]
       tr.remove()
       for(let student of students){
        if(student.id==oldId){
            students.splice(students.indexOf(student),1)
            break
        }
       }
       localStorage.setItem("students", JSON.stringify(students));
    }
</script>

</html>
